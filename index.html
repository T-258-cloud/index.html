<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка на ремонт — UP&amp;DO dental hub</title>
<meta name="description" content="Подайте заявку на ремонт бінокулярів та освітлювального обладнання Univet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Manrope:wght@300;400;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #F2F3F2; }
</style>
</head>
<body>
<div id="up-and-do-repair-root"></div>
<style>
  #up-and-do-repair-root, #up-and-do-repair-root * { box-sizing: border-box; }

  #up-and-do-repair-root {
    /* Палітра з univetloupes.com: фірмовий зелений, майже чорний,
       світло-сірий. Зелений — єдиний акцент, і саме тому працює. */
    --ink: #141414;
    --ink-soft: #5A5A5A;
    --muted: #8C8C8C;
    --label: #3D3D3D;
    --placeholder: #9A9A9A;
    --line: #B9BDB9;
    --line-soft: #C9CCC9;
    --panel: #FFFFFF;
    --bg: #F2F3F2;
    --accent: #1F7D3E;
    --accent-deep: #186231;
    --accent-wash: rgba(31, 125, 62, 0.07);
    --danger: #B3261E;

    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    color: var(--ink);
    background: var(--bg);
    padding: 72px 32px 88px;
    max-width: 780px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  /* Вузький Oswald — другий шрифт самого Univet. Тримає всю структуру:
     номери секцій, підписи полів, кнопки. */
  #up-and-do-repair-root .mono {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* Темна шапка. Фон точно такий, як тло знімків Univet, тому фото
     переходить у нього без видимого шва. */
  #up-and-do-repair-root .hero {
    background: #000;
    margin: -72px -32px 56px;
    padding: 64px 32px 0;
    display: grid;
    grid-template-columns: 1fr 46%;
    align-items: end;
    gap: 24px;
    overflow: hidden;
  }
  #up-and-do-repair-root .hero-text { padding-bottom: 64px; }
  #up-and-do-repair-root .hero-img { align-self: end; margin-bottom: -4px; }
  #up-and-do-repair-root .hero-img img {
    display: block; width: 100%; height: auto;
    mix-blend-mode: screen;
  }
  #up-and-do-repair-root .hero h1 { color: #FFFFFF; }
  #up-and-do-repair-root .hero .lede { color: #B4B4B4; margin-bottom: 0; max-width: 40ch; }

  #up-and-do-repair-root .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; color: var(--accent); margin-bottom: 26px;
  }
  #up-and-do-repair-root .hero .eyebrow { color: #4CAF6B; }
  #up-and-do-repair-root .hero .eyebrow::before { background: #4CAF6B; }

  /* Ілюстрація обраної категорії. Знімок на чорному, тому тримаємо його
     в темній плитці, а не просто на білому. */
  #up-and-do-repair-root .cat-preview {
    display: none; margin: 26px 0 0; padding: 0;
    background: #000; border-radius: 2px; overflow: hidden;
    position: relative;
  }
  #up-and-do-repair-root .cat-preview.visible { display: block; }
  #up-and-do-repair-root .cat-preview img {
    display: block; width: 100%; height: 190px; object-fit: cover; object-position: center;
  }
  #up-and-do-repair-root .cat-preview figcaption {
    position: absolute; left: 20px; bottom: 16px;
    font-size: 10.5px; color: #FFFFFF; letter-spacing: 0.14em;
    font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 400;
  }
  #up-and-do-repair-root .eyebrow::before {
    content: ""; width: 28px; height: 1px; background: var(--accent); display: inline-block;
  }

  #up-and-do-repair-root h1 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: clamp(38px, 6.2vw, 58px);
    line-height: 1.04;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: -0.005em;
    margin: 0 0 20px;
    text-wrap: balance;
  }

  #up-and-do-repair-root .lede {
    font-size: 16px; line-height: 1.65; color: var(--ink-soft);
    max-width: 52ch; margin: 0 0 60px; font-weight: 400;
  }

  /* Секції розділені волосяною лінією, а не відступом — так робить Univet. */
  #up-and-do-repair-root .section {
    padding-top: 34px;
    margin-bottom: 44px;
    border-top: 1px solid var(--line-soft);
  }
  #up-and-do-repair-root .section-title {
    font-size: 11.5px; color: var(--ink); margin-bottom: 30px;
    display: flex; align-items: baseline; gap: 14px;
  }
  #up-and-do-repair-root .section-title .num {
    font-size: 11.5px; color: var(--accent); letter-spacing: 0.1em;
  }

  #up-and-do-repair-root .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 34px; }
  #up-and-do-repair-root .grid + .grid,
  #up-and-do-repair-root .field + .grid,
  #up-and-do-repair-root .grid + .field { margin-top: 26px; }
  #up-and-do-repair-root .field { margin-bottom: 26px; }
  #up-and-do-repair-root .grid .field { margin-bottom: 0; }

  /* Селектор навмисно з класом: підписи мають class="mono", і правило .mono
     має вищу специфічність за просте label — без цього вага 500 не діяла. */
  #up-and-do-repair-root label.mono,
  #up-and-do-repair-root label {
    display: block;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 500; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--label); margin-bottom: 11px;
  }

  /* Поля — лінією знизу, без коробки. Головна прикмета фірмового стилю. */
  #up-and-do-repair-root input[type=text],
  #up-and-do-repair-root input[type=tel],
  #up-and-do-repair-root input[type=email],
  #up-and-do-repair-root input[type=number],
  #up-and-do-repair-root select,
  #up-and-do-repair-root textarea {
    width: 100%;
    font-family: inherit; font-weight: 400; font-size: 16.5px;
    padding: 9px 0 11px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    color: var(--ink);
    outline: none;
    appearance: none;
    transition: border-color .18s ease;
  }
  #up-and-do-repair-root select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%238C8C8C' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat; background-position: right 2px center; padding-right: 28px;
    cursor: pointer;
  }
  #up-and-do-repair-root input:focus,
  #up-and-do-repair-root select:focus,
  #up-and-do-repair-root textarea:focus {
    border-bottom-color: var(--accent);
    border-bottom-width: 2px;
    padding-bottom: 10px;
  }
  #up-and-do-repair-root input::placeholder,
  #up-and-do-repair-root textarea::placeholder { color: var(--placeholder); font-weight: 400; }
  #up-and-do-repair-root textarea {
    min-height: 76px; resize: vertical; line-height: 1.55;
  }
  #up-and-do-repair-root select:disabled { color: var(--muted); cursor: not-allowed; }

  /* Поле ручного введення моделі: зʼявляється лише за потреби. */
  #up-and-do-repair-root .other-model { display: none; }
  #up-and-do-repair-root .other-model.visible { display: block; }

  #up-and-do-repair-root .optional-tag {
    color: var(--muted); text-transform: none; letter-spacing: 0.02em;
    font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 400;
  }
  #up-and-do-repair-root .half { max-width: calc(50% - 17px); }

  /* Вибір деталі: без заливки, тільки контур. Зелений — лише на обраному. */
  #up-and-do-repair-root .part-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  #up-and-do-repair-root .part-btn {
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    padding: 20px 8px 16px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 500; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--label);
    text-align: center; line-height: 1.35;
    transition: border-color .18s ease, color .18s ease, background-color .18s ease;
  }
  #up-and-do-repair-root .part-btn:hover { border-color: var(--ink); color: var(--ink); }
  #up-and-do-repair-root .part-btn svg { stroke: var(--ink-soft); transition: stroke .18s ease; }
  #up-and-do-repair-root .part-btn:hover svg { stroke: var(--ink); }
  #up-and-do-repair-root .part-btn.selected {
    border-color: var(--accent); background: var(--accent-wash); color: var(--accent);
  }
  #up-and-do-repair-root .part-btn.selected svg { stroke: var(--accent); }
  #up-and-do-repair-root .part-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  #up-and-do-repair-root .attach-zone {
    border: 1px dashed var(--line); border-radius: 2px; padding: 24px; background: var(--panel);
  }
  #up-and-do-repair-root .attach-btn {
    display: inline-flex; align-items: center; gap: 9px;
    background: #FFFFFF; border: 1px solid var(--line); color: var(--ink);
    padding: 11px 20px; border-radius: 999px;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: border-color .18s ease, color .18s ease;
  }
  #up-and-do-repair-root .attach-btn:hover { border-color: var(--accent); color: var(--accent); }
  #up-and-do-repair-root .attach-hint {
    font-size: 13px; color: var(--ink-soft); margin-top: 12px; line-height: 1.55; font-weight: 400;
  }
  #up-and-do-repair-root .attach-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  #up-and-do-repair-root .attach-chip { position: relative; width: 82px; }
  #up-and-do-repair-root .attach-thumb {
    width: 82px; height: 82px; border-radius: 2px; object-fit: cover;
    border: 1px solid var(--line); display: block;
  }
  #up-and-do-repair-root .attach-file-icon {
    width: 82px; height: 82px; border-radius: 2px; border: 1px solid var(--line);
    background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
  }
  #up-and-do-repair-root .attach-name {
    font-size: 11px; color: var(--ink-soft); margin-top: 6px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400;
  }
  #up-and-do-repair-root .attach-remove {
    position: absolute; top: -8px; right: -8px; width: 21px; height: 21px; border-radius: 50%;
    background: var(--ink); color: #fff; border: 2px solid var(--panel); font-size: 13px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* Згода — теж <label>, тому явно скидаємо стиль підписів полів:
     інакше вона стає вузьким шрифтом і капслоком, і читати її важко. */
  #up-and-do-repair-root .consent {
    display: flex; gap: 12px; align-items: flex-start; margin: 10px 0 20px;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14.5px; line-height: 1.55; color: var(--ink); font-weight: 400;
    text-transform: none; letter-spacing: normal;
    cursor: pointer;
  }
  #up-and-do-repair-root .consent input {
    margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; cursor: pointer;
  }
  #up-and-do-repair-root .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  #up-and-do-repair-root .privacy { margin: -10px 0 34px 28px; }
  #up-and-do-repair-root .privacy summary {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); cursor: pointer;
    list-style: none; display: inline-block; padding: 3px 0;
  }
  #up-and-do-repair-root .privacy summary::-webkit-details-marker { display: none; }
  #up-and-do-repair-root .privacy summary::before { content: "+ "; }
  #up-and-do-repair-root .privacy[open] summary::before { content: "– "; }
  #up-and-do-repair-root .privacy summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #up-and-do-repair-root .privacy-body {
    margin-top: 14px; padding: 20px 22px;
    background: var(--panel); border-left: 2px solid var(--accent);
    font-size: 13.5px; line-height: 1.7; color: var(--ink-soft); max-width: 62ch; font-weight: 400;
  }
  #up-and-do-repair-root .privacy-body p { margin: 0 0 12px; }
  #up-and-do-repair-root .privacy-body p:last-child { margin-bottom: 0; }
  #up-and-do-repair-root .privacy-body strong { color: var(--ink); font-weight: 600; }
  #up-and-do-repair-root .privacy-body a { color: var(--accent); }

  /* Кнопка-пігулка в зеленому — форма, яку Univet використовує на сайті. */
  #up-and-do-repair-root .submit-btn {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    background: var(--accent); color: #fff; border: none;
    padding: 18px 46px; border-radius: 999px;
    cursor: pointer; margin-top: 8px;
    transition: background-color .18s ease;
  }
  #up-and-do-repair-root .submit-btn:hover { background: var(--accent-deep); }
  #up-and-do-repair-root .submit-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #up-and-do-repair-root .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  #up-and-do-repair-root .error-text {
    font-size: 13px; color: var(--danger); margin-top: 14px; line-height: 1.5; font-weight: 400;
  }

  #up-and-do-repair-root .confirm-panel {
    border-top: 2px solid var(--accent);
    background: var(--panel);
    padding: 44px 40px;
  }
  #up-and-do-repair-root .confirm-panel .ok-badge {
    display: inline-block;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
  }
  #up-and-do-repair-root .req-number {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 46px; font-weight: 300; letter-spacing: 0.01em; margin: 2px 0 18px;
    color: var(--ink);
  }
  #up-and-do-repair-root .copy-btn {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 400; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    padding: 11px 22px; border-radius: 999px; cursor: pointer;
    transition: border-color .18s ease, color .18s ease;
  }
  #up-and-do-repair-root .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 720px) {
    #up-and-do-repair-root .part-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    #up-and-do-repair-root .hero {
      grid-template-columns: 1fr; align-items: stretch; gap: 0;
    }
    #up-and-do-repair-root .hero-text { padding-bottom: 32px; }
    #up-and-do-repair-root .hero-img { max-width: 340px; margin: 0 auto -4px; }
  }
  @media (max-width: 560px) {
    #up-and-do-repair-root { padding: 48px 20px 64px; }
    #up-and-do-repair-root .hero { margin: -48px -20px 40px; padding: 44px 20px 0; }
    #up-and-do-repair-root .grid { grid-template-columns: 1fr; }
    #up-and-do-repair-root .half { max-width: 100%; }
    #up-and-do-repair-root .part-grid { grid-template-columns: repeat(2, 1fr); }
    #up-and-do-repair-root .lede { margin-bottom: 40px; }
    #up-and-do-repair-root .confirm-panel { padding: 32px 24px; }
    #up-and-do-repair-root .req-number { font-size: 36px; }
    #up-and-do-repair-root .submit-btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #up-and-do-repair-root * { transition: none !important; }
  }
</style>

<script>
(function() {
  const BINOCULAR_GROUPS = [
    { label: 'TTL Galilean', models: ['COOL','LOOK','TECHNE GALILEAN','TECHNE RX GALILEAN','ASH GALILEAN','NEW ONE GALILEAN','ONE GALILEAN','ITA 2023 GALILEAN','ITA GALILEAN','NEW TECHNE 2026 GALILEAN'] },
    { label: 'TTL Prismatic', models: ['TECHNE PRISMATIC','TECHNE RX PRISMATIC','ASH PRISMATIC','NEW ONE PRISMATIC','ONE PRISMATIC','ITA 2023 PRISMATIC','ITA PRISMATIC','NEW TECHNE 2026 PRISMATIC'] },
    { label: 'TTL Ergo', models: ['ASH ERGO','ITA ERGO','ONE ERGO','TECHNE ERGO','NEW TECHNE ERGO'] },
    { label: 'MYERGO Galileiano', models: ['REGENT SQUARE','SOHO ROUND'] },
    { label: 'MYERGO RFR', models: ['REGENT SQUARE','SOHO ROUND'] },
    { label: 'Відкидні (Galilean оптика)', models: ['AIR-X GALILEAN','EVO GALILEAN'] },
    { label: 'Відкидні (Prismatic оптика)', models: ['AIR-X PRISMATIC','HEADBAND PRISMATIC'] },
  ];

  const LIGHT_GROUPS = [
    { label: 'EOS Wireless', models: ['EOS WIRELESS'] },
    { label: 'З пультом керування', models: ['EOS HP'] },
    { label: 'Системи підсвітки', models: ['EOS','EOS 2.0','EOS 2.0S','EOS NEXT','LYNX','LYNXPRO'] },
  ];

  const CATEGORIES = [
    { id: 'binoculars', label: 'Бінокуляри', groups: BINOCULAR_GROUPS },
    { id: 'light', label: 'Світло', groups: LIGHT_GROUPS },
  ];

  const PARTS = [
    { id: 'telescope', label: 'Об’єктив (телескоп)', icon: '<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M11 12h2"/>' },
    { id: 'carrier-lens', label: 'Захисна лінза', icon: '<path d="M4 8c2-3 6-4 8-4s6 1 8 4l-2 8c-1 2-3 2-6 2s-5 0-6-2z"/>' },
    { id: 'frame', label: 'Оправа', icon: '<path d="M2 10c1-2 3-3 5-3s4 1 5 3M12 10c1-2 3-3 5-3s4 1 5 3"/><circle cx="7" cy="12" r="3.2"/><circle cx="17" cy="12" r="3.2"/><path d="M10 12h4"/>' },
    { id: 'lighting', label: 'Підсвітка / кабель', icon: '<rect x="9" y="2" width="6" height="10" rx="2"/><path d="M12 12v6"/><path d="M9 20h6"/>' },
    { id: 'other', label: 'Інше', icon: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>' },
  ];

  const MAX_ATTACHMENTS = 4;
  const MAX_TOTAL_BYTES = 8 * 1024 * 1024;
  const OTHER_MODEL = 'Інша модель / немає в списку';

  // Фото виробів Univet, вбудовані в сторінку. Не посилання на їхній сайт:
  // так форма не залежить від чужого хостингу і працює навіть якщо там

      },
      issue: {
        repairType: selRepairType.value,
        part: selectedPart,
        descriptionClient: inDescClient.value.trim(),
        whenStarted: inWhenStarted.value.trim(),
        conditions: inConditions.value.trim(),
        currentlyWorking: selWorking.options[selWorking.selectedIndex]?.text || '',
        actionsTaken: inActionsTaken.value.trim(),
        // Тепер їде і сам вміст файлу, а не лише назва —
        // раніше фото показувалося клієнту й тихо зникало.
        attachments: attachments.map(a => ({
          name: a.name, size: a.size, type: a.type, dataUrl: a.dataUrl,
        })),
      },
    };

    try {
      // Без mode:'no-cors' — інакше відповідь непрозора, і форма рапортує
      // про успіх навіть тоді, коли заявка нікуди не збереглася.
      // Apps Script із доступом «Anyone» віддає CORS-заголовки сам,
      // а text/plain не викликає preflight.
      const res = await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const result = await res.json();
      if (result.status !== 'ok') throw new Error(result.error || 'unknown');

      // Номер видає сервер наскрізним лічильником, а не браузер навмання.
      showConfirmation(result.requestNumber);
    } catch (err) {
      errBox.textContent = 'Не вдалося надіслати заявку. Перевірте зв’язок і спробуйте ще раз. ' +
        'Якщо помилка повторюється — напишіть менеджеру на service_manager@up-and-do.com.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Подати заявку';
    }
  });

  function showConfirmation(reqNumber) {
    form.style.display = 'none';
    confirmHolder.innerHTML = '';
    const panel = el('div', { class: 'confirm-panel' });
    panel.appendChild(el('div', { class: 'ok-badge' }, [document.createTextNode('Заявку прийнято')]));
    panel.appendChild(el('div', { class: 'req-number' }, [document.createTextNode(reqNumber)]));
    panel.appendChild(el('p', { style: 'margin:0 0 18px; font-size:14px; color: var(--ink-soft); line-height:1.5;' }, [
      document.createTextNode('Збережіть цей номер — менеджер використає його при зверненні до вас щодо ремонту.')
    ]));
    const copyBtn = el('button', { type: 'button', class: 'copy-btn' }, [document.createTextNode('Скопіювати номер')]);
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(reqNumber).then(() => {
        copyBtn.textContent = 'Скопійовано ✓';
        setTimeout(() => copyBtn.textContent = 'Скопіювати номер', 1500);
      });
    });
    panel.appendChild(copyBtn);
    confirmHolder.appendChild(panel);
  }
})();
</script>
</body>
</html>
